"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#8be9fd)\
[ 󰣇 ](bg:#7dcfff fg:#090c0c)\
$username\
[](bg:#bd93f9 fg:#7dcfff)\
$directory\
[](fg:#bd93f9 bg:#6272a4)\
$git_branch\
$git_status\
[](fg:#6272a4 bg:#44475a)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
[](fg:#44475a bg:#282a36)\
$time\
[ ](fg:#282a36)\
$line_break$character"""


[username]
show_always = true
style_user = "bg:#7dcfff fg:#090c0c"
style_root = "bg:#7dcfff fg:#ff5555"
format = '[ $user ]($style)'

[hostname]
disabled = false
ssh_only = false
trim_at = '.companyname.com'
style= "bg:#7dcfff fg:#090c0c"
format = '[$ssh_symbol](bold blue)[@$hostname]($style)'

[directory]
style = "fg:#1d2230 bg:#bd93f9"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = " "
"Prismatic" = "󰓎 "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#f8f8f2 bg:#6272a4)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#f8f8f2 bg:#6272a4)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[c]
symbol = " "
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[cpp]
symbol = " "
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[java]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[kotlin]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[haskell]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[python]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'

[docker_context]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($context) ](fg:#bd93f9 bg:#44475a)]($style)'

[conda]
style = "bg:#212736"
format = '[[ $symbol ($environment) ](fg:#bd93f9 bg:#44475a)]($style)'

[pixi]
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#bd93f9 bg:#44475a)]($style)'



[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#c0caf5 bg:#282a36)]($style)'

[line_break]
disabled = true 

[character]
disabled = false
success_symbol = '[❯](bold fg:#50fa7b)'
error_symbol = '[❯](bold fg:#ff5555)'
vimcmd_symbol = '[❮](bold fg:#50fa7b)'
vimcmd_replace_one_symbol = '[❮](bold fg:#bd93f9)'
vimcmd_replace_symbol = '[❮](bold fg:#bd93f9)'
vimcmd_visual_symbol = '[❮](bold fg:#f1fa8c)'


# ❮ ❯

